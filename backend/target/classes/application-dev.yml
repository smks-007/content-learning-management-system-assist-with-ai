server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:clmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${AI_MODEL:llama3}
        options:
          temperature: 0.7
          num-predict: 2048

app:
  jwt:
    secret: clms-secret-key-must-be-at-least-32-chars-long-for-hs256
    expiration: 3600000
    refresh-expiration: 604800000
  file:
    upload-dir: ./uploads
  frontend-url: http://localhost:5173
